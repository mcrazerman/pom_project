name: Mirror to Gitlab

on:
    push:
        branches: ['*']
        tags: ['*']

jobs:
    mirror:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v7
              with:
                fetch-depth: 0 # скачивание всей истории
            - name: Push to Gitlab
              env:
                GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
                GITLAB_PROJECT: ${{ secrets.GITLAB_PROJECT }}
              run: |
                git remote add gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_PROJECT}.git
                git push gitlab --prune 'refs/heads/*:refs/heads/*'
                git push gitlab --prune 'refs/tags/*:refs/tags/*'
